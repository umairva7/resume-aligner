services:
  - type: web
    name: resume-aligner
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k uvicorn.workers.UvicornWorker app.main:app
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: PORT
        value: "10000"
      - key: SESSION_SECRET
        generateValue: true
      - key: SECURE_COOKIES
        value: "True"
      - key: FRONTEND_URL
        value: https://resumealigner.me
      - key: ALLOWED_ORIGINS
        value: https://resumealigner.me,https://www.resumealigner.me
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: DAILY_MATCH_LIMIT
        value: "5"
      - key: DAILY_TAILOR_LIMIT
        value: "5"
